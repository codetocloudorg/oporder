name: CI

# Gates merge, per SPEC.md §7 — a contributor's change doesn't land on an
# "I ran it locally" promise. No live cloud credentials or LLM keys are used
# here; that's deliberate (§7's provider-mocking requirement) and this
# pipeline currently covers the deterministic-logic half of the testing
# strategy. The eval suite (the LLM-mediated half) has no code to test yet.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: gofmt
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"

      - name: build
        run: go build ./...

      - name: test
        run: go test ./... -v -race
